# Local multi-instance test: two API replicas behind one Nginx (docker-compose.multi.yml).
# Socket.IO runs WebSocket-only, so no sticky sessions are needed; any instance
# can serve any socket because events fan out through the Redis adapter.

log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream vnav_api {
  # Shared state across Nginx workers; without it each worker balances on its
  # own and new connections pile onto the first server.
  zone vnav_api 64k;
  # WebSockets are long-lived, so balance by open connections, not by request count.
  least_conn;
  # A stopped container's address drops packets instead of refusing them, so
  # mark a failed instance down for a while and retry the other one quickly.
  server api1:3000 max_fails=1 fail_timeout=10s;
  server api2:3000 max_fails=1 fail_timeout=10s;
}

server {
  listen 8080;
  access_log /var/log/nginx/access.log upstreamlog;
  client_max_body_size 6m;

  location / {
    proxy_pass http://vnav_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Longer than Socket.IO's 25 s ping interval, so idle sockets are not cut.
    proxy_read_timeout 75s;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout;
  }
}
