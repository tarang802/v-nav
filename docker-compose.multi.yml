# Two API instances behind Nginx on http://localhost:8080, for testing
# cross-instance Socket.IO delivery and graceful failover locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml down

x-api: &api
  build: ./server
  env_file: ./server/.env
  environment: &api-env
    NODE_ENV: development
    MONGO_URI: mongodb://mongo:27017/vnav?replicaSet=rs0
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    TRUST_PROXY: '1'
    API_PUBLIC_URL: http://localhost:8080
    LOG_LEVEL: info
  # Both instances share one uploads volume, so an image stored by one is served by the other.
  volumes: ['uploads:/app/uploads']
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    mailpit: { condition: service_started }

services:
  api1:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api1 }
  api2:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api2 }
  lb:
    image: nginx:1.27-alpine
    volumes: ['./ops/nginx/multi.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api1, api2]
